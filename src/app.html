<!doctype html>
<html lang="%lang%" dir="%dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0f766e" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<script nonce="%sveltekit.nonce%">
			// Applies the saved/system color scheme before first paint, avoiding a
			// flash of the wrong theme. Keep in sync with mode-watcher's defaults
			// (storage key "mode-watcher-mode", dark class "dark" — see theme-toggle.svelte).
			(function () {
				try {
					var mode = localStorage.getItem('mode-watcher-mode') || 'system';
					var dark =
						mode === 'dark' ||
						(mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch (e) {
					// localStorage/matchMedia can throw in restricted contexts (e.g. private browsing); fall back to light.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

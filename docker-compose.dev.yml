# Local development support services (database + mail catcher).
# The app itself runs natively for fast hot reload: `pnpm dev` / `pnpm worker:dev`.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   cp .env.example .env   # set DATABASE_URL to localhost:5432, EMAIL_PROVIDER=smtp
#   pnpm db:migrate && pnpm dev
name: arnia-dev

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arnia
      POSTGRES_USER: arnia
      POSTGRES_PASSWORD: devpassword
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18's image places data in a version-specific subdirectory of
      # /var/lib/postgresql itself (not .../data) — see postgres-docker#37.
      - dev_db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arnia -d arnia']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    ports:
      - '8025:8025' # web UI
      - '1025:1025' # SMTP

volumes:
  dev_db_data:

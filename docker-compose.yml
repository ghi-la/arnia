name: arnia

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      ORIGIN: https://${APP_DOMAIN}
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://${APP_DOMAIN}}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      BODY_SIZE_LIMIT: ${MAX_UPLOAD_MB:-25}M
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_INGESTION_ENABLED: ${MAIL_INGESTION_ENABLED:-false}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/healthz']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node_modules/.bin/tsx', 'src/worker.ts']
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_INGESTION_ENABLED: ${MAIL_INGESTION_ENABLED:-false}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SECURE: ${IMAP_SECURE:-true}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_POLL_INTERVAL_MINUTES: ${IMAP_POLL_INTERVAL_MINUTES:-5}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
    volumes:
      - uploads:/app/uploads
    # The image's HEALTHCHECK curls :3000/healthz, which only the `app`
    # service serves — the worker has no HTTP server, so disable it here.
    healthcheck:
      disable: true

  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arnia}
      POSTGRES_USER: ${POSTGRES_USER:-arnia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Postgres 18's image places data in a version-specific subdirectory of
      # /var/lib/postgresql itself (not .../data) — see postgres-docker#37.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-arnia} -d ${POSTGRES_DB:-arnia}']
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:18.6-alpine
    restart: unless-stopped
    depends_on:
      - db
    entrypoint: ['/bin/sh', '/scripts/backup.sh']
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-arnia}
      PGUSER: ${POSTGRES_USER:-arnia}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./scripts/restore.sh:/scripts/restore.sh:ro
      - uploads:/app/uploads
      - backups:/backups

volumes:
  db_data:
  uploads:
  backups:
  caddy_data:
  caddy_config:
